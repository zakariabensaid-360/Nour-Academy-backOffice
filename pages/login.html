<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Dashboard - Nour Academy</title>
</head>

<body class="min-h-screen bg-white m-0 p-0">
    <main class="min-h-screen flex items-center justify-center p-4">
        <section class="w-full max-w-md bg-white p-8 md:p-12 rounded-2xl shadow-2xl">
            <!-- Logo et titre -->
            <div class=" mb-3">
                <img src="logo.webp" alt="Nour Academy" class="w-40 h-auto mx-auto">
            </div>
            <div class="text-center mb-10">
                <p class="text-slate-500 mt-2">
                    Apprendre aujourd'hui, réussir demain
                </p>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-blue-950">
                    Connexion à votre espace
                </h2>
                <p class="text-slate-500 mt-2">
                    Veuillez vous connecter pour accéder à votre compte.
                </p>
            </div>
            <!-- Formulaire de connexion -->
            <form class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label for="login" class="font-semibold text-blue-950">Identifiant</label>
                    <input type="text" name="login" id="email" placeholder="votre Identifiant"
                        class="w-full border rounded-lg px-4 py-3">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="password" class="font-semibold text-blue-950">Mot de passe</label>
                    <input type="password" name="password" id="password" placeholder="Votre mode de passe"
                        class="w-full border rounded-lg px-4 py-3">
                </div>
                <button type="submit" class="w-full gb-blue-900 text-while font-semibold py-3 rounded-lg cursor-pointer hover:bg-blue-800">
                    Se connecter
                </button>


            </form>


        </section>
    </main>

<script src="../src/login.js"></script>
</body>

</html>
